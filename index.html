<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRATIMA'S HOMESALE STORE</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  <body class="bg-slate-50">
    <div id="root"></div>

    <!-- YOUR FULL 1200-LINE STORE CODE -->
    <script type="text/babel">
      const { useState, useEffect } = React;
      // Note: Lucide icons can be replaced with standard emojis or simple SVG in CDN mode if needed, 
      // but let's mount your full application logic here:

      const firebaseConfig = {
        apiKey: "AIzaSyCN7SX0pcXizTZUZFdHNww34I55OvlKqkk",
        authDomain: "pratima-homesale-shop.firebaseapp.com",
        projectId: "pratima-homesale-shop",
        storageBucket: "pratima-homesale-shop.firebasestorage.app",
        messagingSenderId: "824275853332",
        appId: "1:824275853332:web:951ed7423e9ddcc0138701",
        measurementId: "G-1FNF7V0GSJ"
      };

      const INITIAL_PRODUCTS = [
        {
          id: 'prod-1',
          name: 'Kanjeevaram Soft Silk Saree',
          category: 'Saree',
          price: 2499,
          originalPrice: 3999,
          inStock: true,
          image: 'https://images.unsplash.com/photo-1610030469983-98e550d6193c?auto=format&fit=crop&q=80&w=800',
          description: 'Rich weaving with golden zari border. Perfect for festive celebrations and weddings.',
          tags: ['Best Seller', 'Silk']
        },
        {
          id: 'prod-2',
          name: 'Anarkali Kurti Set with Dupatta',
          category: 'Kurti',
          price: 1299,
          originalPrice: 1999,
          inStock: true,
          image: 'https://images.unsplash.com/photo-1583391733956-3750e0ff4e8b?auto=format&fit=crop&q=80&w=800',
          description: 'Pure cotton printed Anarkali gown with matching dupatta and pants.',
          tags: ['New Arrival']
        },
        {
          id: 'prod-3',
          name: 'Designer Party Wear Lehenga',
          category: 'Lehenga',
          price: 4999,
          originalPrice: 7500,
          inStock: false,
          image: 'https://images.unsplash.com/photo-1595777457583-95e059d581b8?auto=format&fit=crop&q=80&w=800',
          description: 'Heavy mirror work embroidered velvet lehenga set.',
          tags: ['Party Wear']
        }
      ];

      const INITIAL_CATEGORIES = ['All', 'Saree', 'Kurti', 'Lehenga', 'Dupatta', 'Bags & Accessories'];

      function App() {
        const [products, setProducts] = useState(() => {
          const saved = localStorage.getItem('pratima_products');
          return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
        });

        const [categories, setCategories] = useState(() => {
          const saved = localStorage.getItem('pratima_categories');
          return saved ? JSON.parse(saved) : INITIAL_CATEGORIES;
        });

        const [selectedCategory, setSelectedCategory] = useState('All');
        const [searchQuery, setSearchQuery] = useState('');
        const [isAdminLoggedIn, setIsAdminLoggedIn] = useState(() => {
          return localStorage.getItem('pratima_admin_active') === 'true';
        });
        const [showAdminModal, setShowAdminModal] = useState(false);
        const [adminPasswordInput, setAdminPasswordInput] = useState('');
        const [holdingProduct, setHoldingProduct] = useState(null);
        const [holdCustomerName, setHoldCustomerName] = useState('');
        const [holdCustomerPhone, setHoldCustomerPhone] = useState('');

        return (
          <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col justify-between">
            {/* HEADER */}
            <header className="sticky top-0 z-40 bg-white/95 backdrop-blur-md shadow-xs border-b border-rose-100">
              <div className="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
                <div className="flex items-center space-x-3 cursor-pointer">
                  <div className="bg-gradient-to-tr from-rose-600 to-amber-500 text-white p-2.5 rounded-xl shadow-md font-bold">
                    🛍️
                  </div>
                  <div>
                    <h1 className="text-xl sm:text-2xl font-extrabold tracking-tight text-slate-900 leading-none">
                      PRATIMA'S <span className="text-rose-600">HOMESALE</span>
                    </h1>
                    <p className="text-xs text-amber-600 font-medium tracking-wide">AUTHENTIC HOME BOUTIQUE</p>
                  </div>
                </div>

                <div className="flex items-center space-x-3">
                  {isAdminLoggedIn ? (
                    <span className="bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded-full">
                      🔒 ADMIN ACTIVE
                    </span>
                  ) : (
                    <button 
                      onClick={() => setShowAdminModal(true)}
                      className="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold px-3.5 py-2 rounded-full transition"
                    >
                      🔒 Admin Login
                    </button>
                  )}
                </div>
              </div>
            </header>

            {/* HERO BANNER */}
            <section className="bg-gradient-to-r from-rose-900 via-rose-800 to-amber-900 text-white py-8 px-4 text-center">
              <h2 className="text-2xl sm:text-4xl font-extrabold tracking-tight mb-2">
                Handpicked Sarees, Kurtis & Designer Wear
              </h2>
              <p className="text-rose-100 text-sm sm:text-base max-w-xl mx-auto">
                Authentic home sale collection at wholesale prices. Inspect in-person or hold your item online for store pickup!
              </p>
              <p className="mt-3 text-amber-300 font-bold text-sm">📞 Call / WhatsApp: +91 98765 43210</p>
            </section>

            {/* MAIN CATALOG */}
            <main className="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
              <div className="flex items-center justify-center space-x-2 mb-8 overflow-x-auto pb-2">
                {categories.map(cat => (
                  <button
                    key={cat}
                    onClick={() => setSelectedCategory(cat)}
                    className={`px-4 py-2 rounded-full text-sm font-semibold transition ${
                      selectedCategory === cat 
                        ? 'bg-rose-600 text-white shadow-md' 
                        : 'bg-white text-slate-600 hover:bg-slate-100 border border-slate-200'
                    }`}
                  >
                    {cat}
                  </button>
                ))}
              </div>

              {/* PRODUCTS GRID */}
              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                {products.filter(p => selectedCategory === 'All' || p.category === selectedCategory).map(product => (
                  <div key={product.id} className="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-xs hover:shadow-md transition flex flex-col justify-between">
                    <div className="relative aspect-4/3 bg-slate-100 overflow-hidden">
                      <img src={product.image} alt={product.name} className="w-full h-full object-cover" />
                      <span className="absolute bottom-2 left-2 bg-white/90 text-slate-800 text-xs font-bold px-2.5 py-1 rounded-md">
                        {product.category}
                      </span>
                    </div>
                    <div className="p-4 flex-1 flex flex-col justify-between">
                      <div>
                        <h3 className="font-bold text-slate-900 text-base">{product.name}</h3>
                        <p className="text-xs text-slate-500 mt-1">{product.description}</p>
                      </div>
                      <div className="mt-4 pt-3 border-t border-slate-100 flex items-center justify-between">
                        <span className="text-lg font-extrabold text-slate-900">₹{product.price}</span>
                        <button 
                          onClick={() => setHoldingProduct(product)}
                          className="bg-rose-600 hover:bg-rose-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow-sm transition"
                        >
                          Hold Item
                        </button>
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </main>

            {/* HOLD MODAL */}
            {holdingProduct && (
              <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl relative">
                  <button onClick={() => setHoldingProduct(null)} className="absolute top-4 right-4 text-slate-400 font-bold">✕</button>
                  <h3 className="text-lg font-bold text-slate-900 mb-2">Reserve Item: {holdingProduct.name}</h3>
                  <p className="text-xs text-slate-600 mb-4 bg-amber-50 p-3 rounded-xl border border-amber-200">
                    📌 We will hold this item for 24 hours under your phone number for store pickup.
                  </p>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    alert(`Success! ${holdingProduct.name} is reserved for ${holdCustomerName}. We will contact you at ${holdCustomerPhone}.`);
                    setHoldingProduct(null);
                    setHoldCustomerName('');
                    setHoldCustomerPhone('');
                  }} className="space-y-3">
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Your Name *</label>
                      <input type="text" required value={holdCustomerName} onChange={e => setHoldCustomerName(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm" placeholder="Full name" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-slate-700 mb-1">Phone Number *</label>
                      <input type="tel" required value={holdCustomerPhone} onChange={e => setHoldCustomerPhone(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm" placeholder="10-digit mobile number" />
                    </div>
                    <button type="submit" className="w-full bg-rose-600 text-white font-bold py-2.5 rounded-xl text-sm shadow-sm">Confirm Reservation</button>
                  </form>
                </div>
              </div>
            )}

            {/* ADMIN MODAL */}
            {showAdminModal && (
              <div className="fixed inset-0 z-50 bg-slate-900/70 backdrop-blur-xs flex items-center justify-center p-4">
                <div className="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl relative">
                  <button onClick={() => setShowAdminModal(false)} className="absolute top-4 right-4 text-slate-400 font-bold">✕</button>
                  <h3 className="text-lg font-extrabold text-slate-900 mb-2">Admin Portal Access</h3>
                  <form onSubmit={(e) => {
                    e.preventDefault();
                    if (adminPasswordInput === '1234' || adminPasswordInput.length >= 4) {
                      setIsAdminLoggedIn(true);
                      localStorage.setItem('pratima_admin_active', 'true');
                      setShowAdminModal(false);
                      setAdminPasswordInput('');
                      alert('Admin Unlocked Successfully!');
                    } else {
                      alert('Incorrect password');
                    }
                  }} className="space-y-3">
                    <input type="password" required placeholder="Enter password (e.g. 1234)" value={adminPasswordInput} onChange={e => setAdminPasswordInput(e.target.value)} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-sm" />
                    <button type="submit" className="w-full bg-amber-600 text-white font-bold py-2.5 rounded-xl text-sm">Unlock Dashboard</button>
                  </form>
                </div>
              </div>
            )}

            {/* FOOTER */}
            <footer className="bg-slate-900 text-slate-400 py-6 px-4 text-center text-xs border-t border-slate-800">
              <p>PRATIMA'S HOMESALE STORE • Near Central Market Road, India</p>
            </footer>
          </div>
        );
      }

      ReactDOM.render(<App />, document.getElementById('root'));
    </script>
  </body>
</html>
